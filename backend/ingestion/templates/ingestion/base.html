<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ClassKit{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2332;
      --muted: #5c6b7a;
      --line: #d5dee8;
      --paper: #f3f6f8;
      --card: #fff;
      --accent: #0058db;
      --accent-soft: #e6f4ef;
      --err: #9b1c1c;
      --err-bg: #fdecec;
      --ok: #0058db;
      --ok-bg: #e6f4ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Roboto", ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 45% at 0% 0%, #e8f2ec 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 0%, #e8eef5 0%, transparent 50%),
        var(--paper);
    }
    .shell {
      max-width: 440px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
    }
    .shell.wide { max-width: 820px; }
    .brand {
      font-family: "Roboto", ui-sans-serif, system-ui, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 0.5rem;
    }
    h1 {
      margin: 0 0 0.4rem;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
    }
    .sub { color: var(--muted); margin: 0 0 1.5rem; line-height: 1.45; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.25rem 1.35rem;
    }
    label {
      display: block;
      font-family: "Roboto", ui-sans-serif, system-ui, sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0.85rem 0 0.35rem;
    }
    label:first-child { margin-top: 0; }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.7rem 0.85rem;
      font: inherit;
      font-size: 1rem;
      background: #fcfdfe;
      color: var(--ink);
    }
    input:focus, select:focus {
      outline: 2px solid color-mix(in srgb, var(--accent) 40%, white);
      border-color: var(--accent);
    }
    .errorlist {
      list-style: none;
      margin: 0.35rem 0 0;
      padding: 0;
      color: var(--err);
      font-family: "Roboto", ui-sans-serif, system-ui, sans-serif;
      font-size: 0.85rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      margin-top: 1.15rem;
      border: none;
      border-radius: 10px;
      padding: 0.8rem 1rem;
      font-family: "Roboto", ui-sans-serif, system-ui, sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn.secondary {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      margin-top: 0.65rem;
    }
    .btn.inline { width: auto; margin: 0; padding: 0.5rem 0.9rem; }
    .links {
      margin-top: 1.25rem;
      text-align: center;
      font-family: "Roboto", ui-sans-serif, system-ui, sans-serif;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .links a { color: var(--accent); font-weight: 600; }
    .flash {
      border-radius: 10px;
      padding: 0.75rem 0.9rem;
      margin-bottom: 1rem;
      font-family: "Roboto", ui-sans-serif, system-ui, sans-serif;
      font-size: 0.9rem;
    }
    .flash.error { background: var(--err-bg); color: var(--err); }
    .flash.success { background: var(--ok-bg); color: var(--ok); }
    .flash.info { background: #eef3f8; color: var(--ink); }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .meta {
      font-family: "Roboto", ui-sans-serif, system-ui, sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      margin-top: 1rem;
    }
    .tile {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem;
      background: var(--card);
      text-decoration: none;
      color: inherit;
    }
    .tile:hover { border-color: var(--accent); background: var(--accent-soft); }
    .tile h3 { margin: 0 0 0.35rem; font-size: 1.05rem; }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #eef3f8;
      padding: 0.15rem 0.4rem;
      border-radius: 6px;
      letter-spacing: 0.06em;
    }
    .token-box {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      word-break: break-all;
      background: #eef3f8;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="shell {% block shell_class %}{% endblock %}">
    {% if messages %}
      {% for message in messages %}
        <div class="flash {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
