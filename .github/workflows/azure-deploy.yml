name: Deploy to Azure

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: education-ai-app
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Build Frontend (React)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build React app
      working-directory: ./frontend
      run: npm run build

    # Setup Python for Backend (Django)
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Create virtual environment
      working-directory: ./backend
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip

    - name: Install Python dependencies
      working-directory: ./backend
      run: |
        source venv/bin/activate
        pip install -r requirements.txt

    # Copy built frontend to Django static files
    - name: Copy React build to Django
      run: |
        mkdir -p backend/static/
        cp -r frontend/dist/* backend/static/ || cp -r frontend/build/* backend/static/ || echo "Frontend build not found"

    # Create deployment package
    - name: Create deployment artifact
      run: |
        mkdir deployment-package
        cp -r backend/* deployment-package/
        # Add production requirements if needed
        echo "gunicorn==20.1.0" >> deployment-package/requirements.txt

    # Deploy to Azure Web App
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./deployment-package
        startup-command: |
          python manage.py collectstatic --noinput &&
          python manage.py migrate &&
          gunicorn config.wsgi:application --bind 0.0.0.0:$PORT

  # Optional: Deploy to Azure Container Apps (alternative)
  containerized-deploy:
    runs-on: ubuntu-latest
    if: false  # Set to true if you prefer containerized deployment
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
        
    - name: Build and push container image
      run: |
        docker build -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/education-ai:${{ github.sha }} .
        docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/education-ai:${{ github.sha }}
        
    - name: Deploy to Azure Container Apps
      uses: azure/container-apps-deploy-action@v1
      with:
        appSourcePath: ${{ github.workspace }}
        acrName: ${{ secrets.REGISTRY_LOGIN_SERVER }}
        containerAppName: education-ai-container
        resourceGroup: ${{ secrets.RESOURCE_GROUP }}
        imageToDeploy: ${{ secrets.REGISTRY_LOGIN_SERVER }}/education-ai:${{ github.sha }}